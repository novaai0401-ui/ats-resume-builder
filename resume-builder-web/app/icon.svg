<?xml version="1.0" encoding="UTF-8"?>
<!-- CallbackCV mark: the callback loop.
     A C-shaped return arrow (the "call back") closing around a checkmark (the
     reply that came). The C is also the brand initial. Glyph sits inside the
     inner 80% so Android's maskable crop never clips it; background is the
     brand gradient shared with the web UI (primary → violet). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CallbackCV">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#cbg)"/>
  <!-- The C / return arrow: an open arc with an arrowhead flying back in -->
  <path d="M345,346 A128,128 0 1 1 345,166"
        fill="none" stroke="#ffffff" stroke-width="52" stroke-linecap="round"/>
  <path d="M316,120 L412,150 L342,222 Z" fill="#ffffff"/>
  <!-- The callback: a confident tick, centred in the loop -->
  <path d="M198,262 L244,310 L330,208"
        fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
