<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Pocket Resume</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a3a5c" />
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; padding: 0; min-height: 100%; background: #f2f5f8; font-family: system-ui, -apple-system, "IBM Plex Sans", sans-serif; color: #1a3a5c; }
      .wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; box-sizing: border-box; }
      .card { background: #fff; border-radius: 16px; padding: 32px; max-width: 420px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.06); text-align: center; }
      h1 { margin: 0 0 12px; font-size: 22px; }
      p { margin: 0 0 20px; color: #5a6778; line-height: 1.5; }
      button { background: #1a3a5c; color: #fff; border: 0; border-radius: 10px; padding: 12px 18px; font-size: 15px; font-weight: 600; cursor: pointer; }
      button:hover { background: #2a5a8a; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="card">
        <h1>You&rsquo;re offline</h1>
        <p>
          Pocket Resume needs an internet connection to load your resumes and run ATS scoring.
          Check your network and try again.
        </p>
        <button onclick="location.reload()">Try again</button>
      </div>
    </main>
  </body>
</html>
