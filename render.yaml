# ═══════════════════════════════════════════════════════════════════════
# Render Blueprint — ATS Resume Builder
# ═══════════════════════════════════════════════════════════════════════
#
# Single config deploys BOTH services from one GitHub repo:
#
#   ┌──────────────────────┐       ┌──────────────────────┐
#   │  ats-rb-web (Next.js)│──────►│  ats-rb-api (NestJS) │
#   │  :4000               │ HTTPS │  :4001               │
#   └──────────────────────┘       └──────────────────────┘
#               ▲                            │
#           Visitors                  ┌──────┴──────┐
#                                     │  PostgreSQL  │
#                                     │  (Supabase)  │
#                                     └─────────────┘
#
# Deploy:
#   1. Push this file to your repo
#   2. On Render → New → Blueprint → connect your GitHub repo
#   3. Render auto-detects render.yaml and creates both services
#   4. Fill in environment variable values in the Render dashboard
#   5. Deploy!
#
# Docs: https://docs.render.com/infrastructure-as-code
# ═══════════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────────────
  # 1. BACKEND API — NestJS + Prisma + PostgreSQL
  # ─────────────────────────────────────────────────────────────────────
  - type: web
    name: ats-rb-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    repo: https://github.com/novaai0401-ui/ats-resume-builder
    branch: main
    plan: starter                    # $7/mo — always on, no cold starts
    region: singapore                # ap-southeast for Indian users
    numInstances: 1
    # DB-aware readiness: /health/db pings Postgres and 503s if it's down,
    # so Render stops routing traffic to an instance whose database is
    # unreachable (a bare /health returns ok even with the DB down).
    healthCheckPath: /health/db
    # Run any pending Prisma migrations BEFORE the new code starts serving
    # traffic. Render executes this in a fresh container of the new image;
    # if it fails, the deploy is aborted and the old version keeps running,
    # so a broken migration cannot take the site down. Uses DIRECT_URL when
    # set so it bypasses the Supabase pooler (required by Prisma).
    preDeployCommand: "npx prisma migrate deploy"
    envVars:
      # ── Core ────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4001"

      # ── CORS — MUST be set to the Web frontend URL after first deploy
      # Example: https://ats-rb-web.onrender.com
      - key: CORS_ORIGIN
        sync: false

      # ── Database (PostgreSQL — Supabase / Render Postgres / Neon) ──
      # Pooled connection used by the runtime API for queries.
      # Supabase example:
      #   postgresql://postgres.<proj>:<password>@aws-0-<region>.pooler.supabase.com:6543/postgres?pgbouncer=true
      - key: DATABASE_URL
        sync: false
      # Direct connection used by `prisma migrate deploy` in the
      # preDeployCommand. REQUIRED on Supabase — the pooler (6543) does
      # not support the advisory locks Prisma needs to apply migrations.
      # Supabase example:
      #   postgresql://postgres.<proj>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
      # If you are NOT on Supabase and your DATABASE_URL goes to the
      # database directly, set DIRECT_URL to the same value.
      - key: DIRECT_URL
        sync: false

      # ── Authentication ──────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true          # Render auto-generates a random value
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "30d"
      - key: TOKEN_ENC_KEY
        sync: false                  # 64-hex-char encryption key

      # ── Redis (Upstash — free tier) ─────────────────────────────────
      - key: REDIS_URL
        sync: false
      - key: REDIS_TOKEN
        sync: false

      # ── AI Provider (Groq — free tier) ──────────────────────────────
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: AI_TIMEOUT_MS
        value: "30000"
      - key: AI_FREE_MAX_REQUESTS_PER_DAY
        value: "10"

      # ── Email / SMTP (Gmail, SendGrid, etc.) ────────────────────────
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_SECURE
        value: "false"

      # ── Stripe Billing (Global — USD) ──────────────────────────────
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STUDENT
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false

      # ── Stripe Billing (India — INR, optional) ─────────────────────
      - key: STRIPE_PRICE_STUDENT_INR
        sync: false
      - key: STRIPE_PRICE_PRO_INR
        sync: false

      # ── Stripe Redirect URLs — set after Web deploys ───────────────
      # Example: https://ats-rb-web.onrender.com/dashboard
      - key: STRIPE_SUCCESS_URL
        sync: false
      - key: STRIPE_CANCEL_URL
        sync: false

      # ── Razorpay (India — UPI / cards / netbanking in INR) ──────────
      # See docs: https://dashboard.razorpay.com/app/keys
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # ── Per-download charge (optional, off by default) ──────────────
      # When true, /resumes/:id/pdf requires a one-time payment. The
      # web service must set NEXT_PUBLIC_ENABLE_DOWNLOAD_CHARGE to the
      # same value.
      - key: ENABLE_DOWNLOAD_CHARGE
        value: "false"
      - key: DOWNLOAD_CHARGE_INR_PAISE
        value: "4900"
      - key: DOWNLOAD_CHARGE_USD_CENTS
        value: "99"
      - key: DOWNLOAD_CHARGE_SUCCESS_URL
        sync: false
      - key: DOWNLOAD_CHARGE_CANCEL_URL
        sync: false

      # ── Social Login OAuth (all optional) ───────────────────────────
      - key: GOOGLE_LOGIN_CLIENT_ID
        sync: false
      - key: GOOGLE_LOGIN_CLIENT_SECRET
        sync: false
      - key: GOOGLE_LOGIN_REDIRECT_URI
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false
      - key: YAHOO_CLIENT_ID
        sync: false
      - key: YAHOO_CLIENT_SECRET
        sync: false
      - key: YAHOO_REDIRECT_URI
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        sync: false
      - key: SOCIAL_LOGIN_SUCCESS_URL
        sync: false

      # ── Google Drive OAuth (optional) ───────────────────────────────
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

      # ── Admin ───────────────────────────────────────────────────────
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_MOBILES
        sync: false

      # ── Admin bootstrap (item 12) ───────────────────────────────────
      # On API boot, AdminBootstrapService ensures the admin user exists
      # with the bcrypt hash of ADMIN_BOOTSTRAP_PASSWORD. Plaintext is
      # never persisted. Leave ADMIN_BOOTSTRAP_PASSWORD empty to skip.
      # Set ADMIN_BOOTSTRAP_FORCE_RESET=true once after rotating the
      # password, then revert to false on the next deploy.
      - key: ADMIN_BOOTSTRAP_EMAIL
        value: novaai0401@gmail.com
      - key: ADMIN_BOOTSTRAP_MOBILE
        value: "+919307009427"
      - key: ADMIN_BOOTSTRAP_NAME
        value: Platform Admin
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: ADMIN_BOOTSTRAP_FORCE_RESET
        value: "false"

      # ── Security hardening ─────────────────────────────────────────
      # Controls the Have I Been Pwned breached-password check on
      # register / change-password. Disable only if your deployment
      # cannot reach api.pwnedpasswords.com.
      - key: ENABLE_HIBP_CHECK
        value: "true"

      # ── Feature Flags ───────────────────────────────────────────────
      - key: FORCE_DISABLE_RATE_LIMIT
        value: "false"

  # ─────────────────────────────────────────────────────────────────────
  # 2. FRONTEND WEB — Next.js (App Router, Standalone)
  # ─────────────────────────────────────────────────────────────────────
  - type: web
    name: ats-rb-web
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    repo: https://github.com/novaai0401-ui/ats-resume-builder
    branch: main
    plan: starter                    # $7/mo — always on, no cold starts
    region: singapore                # ap-southeast for Indian users
    numInstances: 1
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"

      # ── API URL (CRITICAL — baked into Next.js build) ───────────────
      # Must point to the API service URL on Render.
      # Example: https://ats-rb-api.onrender.com
      #
      # IMPORTANT: This is a build-time variable. After changing it,
      # you MUST trigger a manual redeploy for it to take effect.
      - key: NEXT_PUBLIC_API_URL
        sync: false

      # ── Admin config ────────────────────────────────────────────────
      - key: NEXT_PUBLIC_ADMIN_EMAILS
        sync: false
      - key: NEXT_PUBLIC_ADMIN_USER_IDS
        sync: false
      - key: NEXT_PUBLIC_ADMIN_MOBILES
        sync: false

      # ── Session config ──────────────────────────────────────────────
      - key: NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MS
        value: "1800000"

      # ── Per-download charge (must mirror ENABLE_DOWNLOAD_CHARGE on API)
      # BUILD-TIME variable — change requires a manual redeploy of the web
      # service, not just an env-var save.
      - key: NEXT_PUBLIC_ENABLE_DOWNLOAD_CHARGE
        value: "false"
