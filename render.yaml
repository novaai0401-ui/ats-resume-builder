# ═══════════════════════════════════════════════════════════════════════
# Render Blueprint — ATS Resume Builder
# ═══════════════════════════════════════════════════════════════════════
#
# Single config deploys BOTH services from one GitHub repo:
#
#   ┌──────────────────────┐       ┌──────────────────────┐
#   │  ats-rb-web (Next.js)│──────►│  ats-rb-api (NestJS) │
#   │  :4000               │ HTTPS │  :4001               │
#   └──────────────────────┘       └──────────────────────┘
#               ▲                            │
#           Visitors                  ┌──────┴──────┐
#                                     │  PostgreSQL  │
#                                     │  (Supabase)  │
#                                     └─────────────┘
#
# Deploy:
#   1. Push this file to your repo
#   2. On Render → New → Blueprint → connect your GitHub repo
#   3. Render auto-detects render.yaml and creates both services
#   4. Fill in environment variable values in the Render dashboard
#   5. Deploy!
#
# Docs: https://docs.render.com/infrastructure-as-code
# ═══════════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────────────
  # 1. BACKEND API — NestJS + Prisma + PostgreSQL
  # ─────────────────────────────────────────────────────────────────────
  - type: web
    name: ats-rb-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    repo: https://github.com/novaai0401-ui/ats-resume-builder
    branch: main
    plan: starter                    # $7/mo — always on, no cold starts
    region: singapore                # ap-southeast for Indian users
    numInstances: 1
    # DB-aware readiness: /health/db pings Postgres and 503s if it's down,
    # so Render stops routing traffic to an instance whose database is
    # unreachable (a bare /health returns ok even with the DB down).
    healthCheckPath: /health/db
    # Run any pending Prisma migrations BEFORE the new code starts serving
    # traffic. Render executes this in a fresh container of the new image;
    # if it fails, the deploy is aborted and the old version keeps running,
    # so a broken migration cannot take the site down. Uses DIRECT_URL when
    # set so it bypasses the Supabase pooler (required by Prisma).
    preDeployCommand: "npx prisma migrate deploy"
    envVars:
      # ── Core ────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4001"

      # ── CORS — MUST be set to the Web frontend URL after first deploy
      # Example: https://ats-rb-web.onrender.com
      - key: CORS_ORIGIN
        sync: false

      # ── Database (PostgreSQL — Supabase / Render Postgres / Neon) ──
      # Pooled connection used by the runtime API for queries.
      # Supabase example:
      #   postgresql://postgres.<proj>:<password>@aws-0-<region>.pooler.supabase.com:6543/postgres?pgbouncer=true
      - key: DATABASE_URL
        sync: false
      # Direct connection used by `prisma migrate deploy` in the
      # preDeployCommand. REQUIRED on Supabase — the pooler (6543) does
      # not support the advisory locks Prisma needs to apply migrations.
      # Supabase example:
      #   postgresql://postgres.<proj>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
      # If you are NOT on Supabase and your DATABASE_URL goes to the
      # database directly, set DIRECT_URL to the same value.
      - key: DIRECT_URL
        sync: false

      # ── Authentication ──────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true          # Render auto-generates a random value
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "30d"
      - key: TOKEN_ENC_KEY
        sync: false                  # 64-hex-char encryption key

      # ── Redis (Upstash — free tier) ─────────────────────────────────
      - key: REDIS_URL
        sync: false
      - key: REDIS_TOKEN
        sync: false

      # ── AI Provider (Groq — free tier) ──────────────────────────────
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: AI_TIMEOUT_MS
        value: "30000"
      - key: AI_FREE_MAX_REQUESTS_PER_DAY
        value: "10"

      # ── Error tracking (Sentry) — optional, no-op when unset ─────────
      - key: SENTRY_DSN
        sync: false

      # ── Email / SMTP (Gmail, SendGrid, etc.) ────────────────────────
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_SECURE
        value: "false"

      # ── Stripe Billing (Global — USD) ──────────────────────────────
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STUDENT
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false

      # ── Stripe Billing (India — INR, optional) ─────────────────────
      - key: STRIPE_PRICE_STUDENT_INR
        sync: false
      - key: STRIPE_PRICE_PRO_INR
        sync: false

      # ── Stripe Redirect URLs — set after Web deploys ───────────────
      # Example: https://ats-rb-web.onrender.com/dashboard
      - key: STRIPE_SUCCESS_URL
        sync: false
      - key: STRIPE_CANCEL_URL
        sync: false

      # ── Razorpay (India — UPI / cards / netbanking in INR) ──────────
      # See docs: https://dashboard.razorpay.com/app/keys
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # ── Per-download charge ─────────────────────────────────────────
      # This ONE flag drives the whole feature. When "true", downloads
      # require a one-time payment (₹49 India / $0.99 rest) — the checkout
      # window appears for FREE users (incl. anyone who cancelled a plan);
      # active ₹499 plan users still download free. The web frontend reads
      # this live from GET /billing/download-charge/config, so flipping it
      # here (or in the Render dashboard) is enough — NO web rebuild and NO
      # NEXT_PUBLIC mirror is needed (that var is unused by the code).
      # PREREQUISITE: live RAZORPAY_KEY_ID/SECRET must be set, otherwise
      # createOrder throws "Razorpay is not configured" and downloads break.
      - key: ENABLE_DOWNLOAD_CHARGE
        value: "false"
      - key: DOWNLOAD_CHARGE_INR_PAISE
        value: "4900"
      - key: DOWNLOAD_CHARGE_USD_CENTS
        value: "99"
      - key: DOWNLOAD_CHARGE_SUCCESS_URL
        sync: false
      - key: DOWNLOAD_CHARGE_CANCEL_URL
        sync: false

      # ── Social Login OAuth (all optional) ───────────────────────────
      - key: GOOGLE_LOGIN_CLIENT_ID
        sync: false
      - key: GOOGLE_LOGIN_CLIENT_SECRET
        sync: false
      - key: GOOGLE_LOGIN_REDIRECT_URI
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false
      - key: YAHOO_CLIENT_ID
        sync: false
      - key: YAHOO_CLIENT_SECRET
        sync: false
      - key: YAHOO_REDIRECT_URI
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        sync: false
      - key: SOCIAL_LOGIN_SUCCESS_URL
        sync: false

      # ── Google Drive OAuth (optional) ───────────────────────────────
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

      # ── Admin ───────────────────────────────────────────────────────
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_MOBILES
        sync: false

      # ── Admin bootstrap (item 12) ───────────────────────────────────
      # On API boot, AdminBootstrapService ensures the admin user exists
      # with the bcrypt hash of ADMIN_BOOTSTRAP_PASSWORD. Plaintext is
      # never persisted. Leave ADMIN_BOOTSTRAP_PASSWORD empty to skip.
      # Set ADMIN_BOOTSTRAP_FORCE_RESET=true once after rotating the
      # password, then revert to false on the next deploy.
      - key: ADMIN_BOOTSTRAP_EMAIL
        value: novaai0401@gmail.com
      - key: ADMIN_BOOTSTRAP_MOBILE
        value: "+919307009427"
      - key: ADMIN_BOOTSTRAP_NAME
        value: Platform Admin
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: ADMIN_BOOTSTRAP_FORCE_RESET
        value: "false"

      # ── Security hardening ─────────────────────────────────────────
      # Controls the Have I Been Pwned breached-password check on
      # register / change-password. Disable only if your deployment
      # cannot reach api.pwnedpasswords.com.
      - key: ENABLE_HIBP_CHECK
        value: "true"

      # ── Feature Flags ───────────────────────────────────────────────
      - key: FORCE_DISABLE_RATE_LIMIT
        value: "false"

      # ── Live jobs feed (Adzuna) — R-087 ─────────────────────────────
      # Register free at https://developer.adzuna.com → Application ID +
      # Application Key. Setting BOTH enables the /jobs live-openings
      # panel and the email job alerts; without them those surfaces stay
      # honestly disabled. Verify with GET /admin/jobs/status.
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: ADZUNA_COUNTRY
        value: "in"
      - key: ADZUNA_DEFAULT_LOCATION
        value: ""

      # ── Cron trigger secret — R-087 ─────────────────────────────────
      # Shared secret the cron services below send as `x-cron-secret`.
      # Generate any long random string; must match the cron services.
      - key: CRON_SECRET
        sync: false

      # ── WhatsApp notifications (Meta Cloud API) — R-087, optional ───
      # From developers.facebook.com → WhatsApp → API Setup. All unset =
      # channel silently off (email keeps working). Verify with
      # GET /admin/whatsapp/status.
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_NUDGE_TEMPLATE
        sync: false
      - key: WHATSAPP_ALERT_TEMPLATE
        sync: false

  # ─────────────────────────────────────────────────────────────────────
  # 2. FRONTEND WEB — Next.js (App Router, Standalone)
  # ─────────────────────────────────────────────────────────────────────
  - type: web
    name: ats-rb-web
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    repo: https://github.com/novaai0401-ui/ats-resume-builder
    branch: main
    plan: starter                    # $7/mo — always on, no cold starts
    region: singapore                # ap-southeast for Indian users
    numInstances: 1
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"

      # ── API URL (CRITICAL — baked into Next.js build) ───────────────
      # Must point to the API service URL on Render.
      # Example: https://ats-rb-api.onrender.com
      #
      # IMPORTANT: This is a build-time variable. After changing it,
      # you MUST trigger a manual redeploy for it to take effect.
      - key: NEXT_PUBLIC_API_URL
        sync: false

      # ── Admin config ────────────────────────────────────────────────
      - key: NEXT_PUBLIC_ADMIN_EMAILS
        sync: false
      - key: NEXT_PUBLIC_ADMIN_USER_IDS
        sync: false
      - key: NEXT_PUBLIC_ADMIN_MOBILES
        sync: false

      # ── Session config ──────────────────────────────────────────────
      - key: NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MS
        value: "1800000"

      # ── Per-download charge (LEGACY / UNUSED) ───────────────────────
      # The web no longer reads this build-time flag — the payment gate is
      # driven live by the API's ENABLE_DOWNLOAD_CHARGE via
      # GET /billing/download-charge/config. Kept only to avoid breaking an
      # existing Render env; setting it has no effect. Enable the feature on
      # the API flag alone.
      - key: NEXT_PUBLIC_ENABLE_DOWNLOAD_CHARGE
        value: "false"


  # ─────────────────────────────────────────────────────────────────────
  # MCP — hosted CallbackCV connector for ChatGPT / Claude (R-099).
  # Multi-tenant: users authenticate per-request (OAuth or Bearer), so one
  # instance serves everyone. OPT-IN COST: a separate always-on service.
  # After first deploy: set MCP_PUBLIC_URL to this service's public URL
  # (or the mcp.tekivex.com custom domain once attached) — OAuth discovery
  # metadata is built from it, so it must match exactly.
  - type: web
    name: ats-rb-mcp
    runtime: node
    rootDir: resume-builder-mcp
    repo: https://github.com/novaai0401-ui/ats-resume-builder
    branch: main
    plan: starter                    # $7/mo — always on, no cold starts
    region: singapore
    numInstances: 1
    healthCheckPath: /health
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MCP_TRANSPORT
        value: http
      - key: MCP_PORT
        value: "10000"               # Render's default expected port
      - key: PORT
        value: "10000"
      - key: POCKET_RESUME_API_URL
        value: https://ats-rb-api.onrender.com
      # Signs/encrypts OAuth client ids, codes, and wrapped tokens.
      # Rotating it revokes every issued connector token at once.
      - key: MCP_OAUTH_SECRET
        generateValue: true
      # Public https origin of THIS service — set after first deploy.
      - key: MCP_PUBLIC_URL
        sync: false

  # ─────────────────────────────────────────────────────────────────────
  # 3. CRON — outcome nudges (R-031: the 7-day "any reply?" single-tap
  #    email that fights ghosting). Runs daily 03:30 UTC = 09:00 IST.
  #
  #    Built from cron/Dockerfile — the script is the image ENTRYPOINT and
  #    reads CRON_TARGET_URL + CRON_SECRET from env. Deliberately NO
  #    dockerCommand: Render exec-parses that field without a real shell,
  #    which mangled the previous quoted curl one-liner into a single
  #    "command not found" token (exit 127, Jul 19 failed runs).
  #    Set the SAME CRON_SECRET here and on ats-rb-api.
  # ─────────────────────────────────────────────────────────────────────
  - type: cron
    name: ats-rb-cron-nudges
    runtime: docker
    dockerfilePath: ./cron/Dockerfile
    dockerContext: ./cron
    repo: https://github.com/novaai0401-ui/ats-resume-builder
    branch: main
    schedule: "30 3 * * *"
    region: singapore
    envVars:
      - key: CRON_TARGET_URL
        value: https://ats-rb-api.onrender.com/outcome-nudge/run
      - key: CRON_SECRET
        sync: false

  # ─────────────────────────────────────────────────────────────────────
  # 4. CRON — job-alert email digests (needs Adzuna keys on the API to
  #    produce results; no-ops harmlessly otherwise). Daily 04:00 UTC =
  #    09:30 IST. Same image/script as the nudges cron.
  # ─────────────────────────────────────────────────────────────────────
  - type: cron
    name: ats-rb-cron-job-alerts
    runtime: docker
    dockerfilePath: ./cron/Dockerfile
    dockerContext: ./cron
    repo: https://github.com/novaai0401-ui/ats-resume-builder
    branch: main
    schedule: "0 4 * * *"
    region: singapore
    envVars:
      - key: CRON_TARGET_URL
        value: https://ats-rb-api.onrender.com/job-alerts/run-cron
      - key: CRON_SECRET
        sync: false
