name: E2E (Playwright)

# Runs the browser end-to-end suite against a deployed/preview URL.
# The public smoke + auth-validation specs run with no secrets. The
# authenticated journeys run only when E2E_EMAIL / E2E_PASSWORD secrets exist.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target base URL (overrides the PLAYWRIGHT_BASE_URL secret)'
        required: false

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resume-builder-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            resume-builder-shared/package-lock.json
            resume-builder-web/package-lock.json

      - name: Build shared
        run: cd ../resume-builder-shared && npm ci && npm run build

      - name: Install web deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E
        run: npm run test:e2e
        env:
          # Prefer the manual input, then a repo secret, else the public preview.
          PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.base_url || secrets.PLAYWRIGHT_BASE_URL || 'https://ats-rb-web.onrender.com' }}
          PLAYWRIGHT_API_URL: ${{ secrets.PLAYWRIGHT_API_URL }}
          PLAYWRIGHT_NO_SERVER: '1'
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: resume-builder-web/playwright-report/
          retention-days: 7
