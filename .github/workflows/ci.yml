name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# @playwright/test (web devDep) pulls in `playwright`, whose npm postinstall
# downloads browsers. The unit/build jobs don't need them (the e2e workflow
# installs browsers explicitly), so skip the download to keep `npm ci` fast and
# offline-safe.
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  lint-and-test-web:
    name: Lint & Test (Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resume-builder-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            resume-builder-shared/package-lock.json
            resume-builder-web/package-lock.json

      - name: Install & build shared dependencies
        run: cd ../resume-builder-shared && npm ci && npm run build

      - name: Install web dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test

  build-web:
    name: Build (Web)
    runs-on: ubuntu-latest
    needs: lint-and-test-web
    defaults:
      run:
        working-directory: resume-builder-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            resume-builder-shared/package-lock.json
            resume-builder-web/package-lock.json

      - name: Install & build shared dependencies
        run: cd ../resume-builder-shared && npm ci && npm run build

      - name: Install web dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.example.com' }}

  lint-and-test-api:
    name: Lint & Test (API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resume-builder-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            resume-builder-shared/package-lock.json
            packages/resume-schemas/package-lock.json
            packages/resume-intelligence/package-lock.json
            resume-builder-api/package-lock.json

      - name: Install & build shared packages
        run: |
          cd ../resume-builder-shared && npm ci && npm run build
          cd ../packages/resume-schemas && npm ci && npm run build
          cd ../resume-intelligence && npm ci && npm run build

      - name: Install API dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build API
        run: npm run build

      # Install a real Chrome so the PDF export + ATS round-trip e2e actually
      # render (the app uses puppeteer-core, which ships no browser).
      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run tests
        run: npm test
        env:
          CHROME_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
